# Copy to config/local.yaml (gitignored) and fill in for your lab.
# Never commit real hostnames, IPs, paths, usernames, or tokens.

nas:
  api_endpoint: "wss://NAS_HOST/api/current"
  api_username: "NAS_API_USER"
  ssh_host_alias: "nas"
  lan_cidr: "LAN_CIDR/24"
  nfs_server: "NAS_HOST"
  media_export: "/path/to/media"
  downloads_export: "/path/to/downloads"
  config_pool: "CONFIG_POOL"
  media_pool: "MEDIA_POOL"
  backup_pool: "BACKUP_POOL"

cluster:
  name: streamnest
  node_ip: "K3S_NODE_IP"
  ssh_user: ubuntu
  ssh_private_key_file: "~/.ssh/ID_FILE"

git:
  repo_url: "https://github.com/OWNER/streamnest-platform.git"

# One-way seed from live TrueNAS Apps (never write back to live paths)
seeds:
  nas_config_root: "/path/to/configs"
  nas_seed_root: "/path/to/configs/streamnest-seeds"
  nas_nfs_server: "NAS_HOST"

registry:
  host: "NAS_HOST:5000"
  username: "streamnest-robot"
  # password only in SOPS / env — not here
