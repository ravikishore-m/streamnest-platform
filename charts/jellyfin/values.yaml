nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/jellyfin/jellyfin
  tag: "12.2"
  digest: ""  # set after pull/scan — never commit mutable latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 1

strategy:
  type: Recreate

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  fsGroup: 568
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 568
  runAsGroup: 568
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

service:
  type: NodePort
  port: 8096
  nodePort: 30096
  httpsPort: 8920

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: jellyfin.streamnest.lan
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: "500m"
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 4Gi

hardwareAcceleration:
  enabled: false

persistence:
  config:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  cache:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 30Gi
  transcodes:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi

# Site-specific NFS: override in gitignored local values only
media:
  enabled: false
  readOnly: true
  nfs:
    server: "NAS_NFS_SERVER"
    path: "/MEDIA_EXPORT_PATH"
  mountPath: /media

downloads:
  enabled: false
  readOnly: false
  nfs:
    server: "NAS_NFS_SERVER"
    path: "/DOWNLOADS_EXPORT_PATH"
  mountPath: /downloads

env: []
nodeSelector: {}
tolerations: []
affinity: {}

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 10

networkPolicy:
  enabled: true
  nfsCidr: "NAS_NFS_CIDR"

publishedServerUrl: ""
