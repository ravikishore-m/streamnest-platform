replicaCount: 1
image:
  repository: ghcr.io/home-operations/bazarr
  tag: "1.6.2"
  digest: ""  # set before deploy
service:
  type: NodePort
  port: 6767
  nodePort: 30767
configMountPath: /config
persistence:
  size: 5Gi
  storageClass: ""
probes:
  enabled: true
  path: /
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
extraVolumes: []
extraVolumeMounts: []
nameOverride: ""
fullnameOverride: ""

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: bazarr.streamnest.lan
      paths:
        - path: /
          pathType: Prefix
  tls: []
