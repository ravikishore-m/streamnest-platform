replicaCount: 1
image:
  repository: ghcr.io/home-operations/bazarr
  tag: "1.6.2"
  digest: ""  # set before deploy
service:
  type: ClusterIP
  port: 6767
configMountPath: /config
persistence:
  size: 5Gi
  storageClass: ""
probes:
  enabled: true
  path: /
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
extraVolumes: []
extraVolumeMounts: []
nameOverride: ""
fullnameOverride: ""
