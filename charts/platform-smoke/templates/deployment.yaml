apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-platform-smoke
  labels:
    app.kubernetes.io/name: platform-smoke
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-smoke
    spec:
      containers:
        - name: smoke
          image: {{ include "platform-smoke.image" . }}
          {{- with .Values.image.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          readinessProbe:
            httpGet:
              path: {{ .Values.probePath | default "/healthz" }}
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
