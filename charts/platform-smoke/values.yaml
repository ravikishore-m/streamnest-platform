replicaCount: 1
image:
  repository: registry.streamnest.lan:5000/streamnest/platform-smoke
  tag: "latest"
  digest: ""
probePath: /healthz
service:
  type: NodePort
  port: 8080
  nodePort: 30898
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: platform-smoke.streamnest.lan
      paths:
        - path: /
          pathType: Prefix
  tls: []
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
imagePullSecrets:
  - name: regcred
