replicaCount: 1
image:
  # Public interim image until guest→NAS registry path is bridged
  repository: ghcr.io/stefanprodan/podinfo
  tag: "6.7.1"
  digest: ""
probePath: /healthz
service:
  type: NodePort
  port: 9898
  nodePort: 30898
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: platform-smoke.streamnest.lan
      paths:
        - path: /
          pathType: Prefix
  tls: []
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
imagePullSecrets: []
