replicaCount: 1
image:
  repository: ghcr.io/navidrome/navidrome
  tag: "0.64.2"
  digest: ""  # set before deploy
service:
  type: ClusterIP
  port: 4533
configMountPath: /config
persistence:
  size: 5Gi
  storageClass: ""
probes:
  enabled: true
  path: /ping
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi
extraVolumes: []
extraVolumeMounts: []
nameOverride: ""
fullnameOverride: ""
