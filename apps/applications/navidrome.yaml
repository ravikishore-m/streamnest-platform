apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: navidrome
  namespace: argocd
  labels:
    env: streamnest
    app: navidrome
spec:
  project: default
  sources:
    - repoURL: https://github.com/ravikishore-m/streamnest-platform.git
      targetRevision: main
      path: charts/navidrome
      helm:
        valueFiles:
          - $values/apps/navidrome/values.yaml
    - repoURL: https://github.com/ravikishore-m/streamnest-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: navidrome
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Manual sync until acceptance gates pass
