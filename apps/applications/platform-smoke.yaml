apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-smoke
  namespace: argocd
  labels:
    env: streamnest
    app: platform-smoke
spec:
  project: default
  sources:
    - repoURL: https://github.com/ravikishore-m/streamnest-platform.git
      targetRevision: main
      path: charts/platform-smoke
      helm:
        valueFiles:
          - $values/apps/platform-smoke/values.yaml
    - repoURL: https://github.com/ravikishore-m/streamnest-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-smoke
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
