apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config
  namespace: argocd
  labels:
    env: streamnest
    app: argocd-config
spec:
  # Uses default until platform/argocd AppProject exists; pipeline applies project first.
  project: default
  source:
    repoURL: https://github.com/ravikishore-m/streamnest-platform.git
    targetRevision: main
    path: platform/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
