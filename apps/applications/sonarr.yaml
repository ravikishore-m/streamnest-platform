apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarr
  namespace: argocd
  labels:
    env: streamnest
    app: sonarr
spec:
  project: streamnest
  sources:
    - repoURL: https://github.com/ravikishore-m/streamnest-platform.git
      targetRevision: main
      path: charts/sonarr
      helm:
        valueFiles:
          - $values/apps/sonarr/values.yaml
    - repoURL: https://github.com/ravikishore-m/streamnest-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sonarr
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
