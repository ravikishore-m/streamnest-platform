apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: radarr
  namespace: argocd
  labels:
    env: streamnest
    app: radarr
spec:
  project: default
  sources:
    - repoURL: https://github.com/ravikishore-m/streamnest-platform.git
      targetRevision: main
      path: charts/radarr
      helm:
        valueFiles:
          - $values/apps/radarr/values.yaml
    - repoURL: https://github.com/ravikishore-m/streamnest-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: radarr
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
