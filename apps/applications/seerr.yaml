apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seerr
  namespace: argocd
  labels:
    env: streamnest
    app: seerr
spec:
  project: default
  sources:
    - repoURL: REPLACE_GIT_REPO_URL
      targetRevision: main
      path: charts/seerr
      helm:
        valueFiles:
          - $values/apps/seerr/values.yaml
    - repoURL: REPLACE_GIT_REPO_URL
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: seerr
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Manual sync until acceptance gates pass
