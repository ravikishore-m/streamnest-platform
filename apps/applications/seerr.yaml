apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seerr
  namespace: argocd
  labels:
    env: streamnest
    app: seerr
spec:
  project: streamnest
  sources:
    - repoURL: https://github.com/ravikishore-m/streamnest-platform.git
      targetRevision: main
      path: charts/seerr
      helm:
        valueFiles:
          - $values/apps/seerr/values.yaml
    - repoURL: https://github.com/ravikishore-m/streamnest-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: seerr
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
