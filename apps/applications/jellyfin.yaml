apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
  labels:
    env: streamnest
    app: jellyfin
spec:
  project: streamnest
  sources:
    - repoURL: https://github.com/ravikishore-m/streamnest-platform.git
      targetRevision: main
      path: charts/jellyfin
      helm:
        valueFiles:
          - $values/apps/jellyfin/values.yaml
    - repoURL: https://github.com/ravikishore-m/streamnest-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
