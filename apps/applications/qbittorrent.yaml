apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qbittorrent
  namespace: argocd
  labels:
    env: streamnest
    app: qbittorrent
spec:
  project: default
  sources:
    - repoURL: https://github.com/ravikishore-m/streamnest-platform.git
      targetRevision: main
      path: charts/qbittorrent
      helm:
        valueFiles:
          - $values/apps/qbittorrent/values.yaml
    - repoURL: https://github.com/ravikishore-m/streamnest-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: qbittorrent
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # Manual sync until acceptance gates pass
