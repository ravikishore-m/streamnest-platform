# Staging values for prowlarr. Digests pinned in chart values; override here after scan.
persistence:
  size: 5Gi

service:
  type: NodePort
  nodePort: 30696
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: prowlarr.streamnest.lan
      paths:
        - path: /
          pathType: Prefix
