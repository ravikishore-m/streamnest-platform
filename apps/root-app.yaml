apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: streamnest-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: REPLACE_GIT_REPO_URL
    targetRevision: main
    path: apps/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
