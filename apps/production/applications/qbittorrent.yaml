apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-qbittorrent
  namespace: argocd
  labels:
    env: production
    app: qbittorrent
spec:
  project: default
  sources:
    - repoURL: REPLACE_GIT_REPO_URL
      targetRevision: main
      path: charts/qbittorrent
      helm:
        valueFiles:
          - $values/apps/production/qbittorrent/values.yaml
    - repoURL: REPLACE_GIT_REPO_URL
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: production-qbittorrent
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    # manual sync only
