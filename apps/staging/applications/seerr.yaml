apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-seerr
  namespace: argocd
  labels:
    env: staging
    app: seerr
spec:
  project: default
  sources:
    - repoURL: REPLACE_GIT_REPO_URL
      targetRevision: main
      path: charts/seerr
      helm:
        valueFiles:
          - $values/apps/staging/seerr/values.yaml
    - repoURL: REPLACE_GIT_REPO_URL
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: staging-seerr
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    # manual sync only
