apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-platform-smoke
  namespace: argocd
  labels:
    env: staging
    app: platform-smoke
spec:
  project: default
  sources:
    - repoURL: REPLACE_GIT_REPO_URL
      targetRevision: main
      path: charts/platform-smoke
      helm:
        valueFiles:
          - $values/apps/staging/platform-smoke/values.yaml
    - repoURL: REPLACE_GIT_REPO_URL
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: staging-platform-smoke
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    # manual sync only
