apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-sonarr
  namespace: argocd
  labels:
    env: staging
    app: sonarr
spec:
  project: default
  sources:
    - repoURL: REPLACE_GIT_REPO_URL
      targetRevision: main
      path: charts/sonarr
      helm:
        valueFiles:
          - $values/apps/staging/sonarr/values.yaml
    - repoURL: REPLACE_GIT_REPO_URL
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: staging-sonarr
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    # manual sync only
