apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-prowlarr
  namespace: argocd
  labels:
    env: staging
    app: prowlarr
spec:
  project: default
  sources:
    - repoURL: REPLACE_GIT_REPO_URL
      targetRevision: main
      path: charts/prowlarr
      helm:
        valueFiles:
          - $values/apps/staging/prowlarr/values.yaml
    - repoURL: REPLACE_GIT_REPO_URL
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: staging-prowlarr
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    # manual sync only
