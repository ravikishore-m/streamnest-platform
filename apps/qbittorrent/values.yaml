# Staging values for qbittorrent. Digests pinned in chart values; override here after scan.
persistence:
  size: 5Gi

service:
  type: NodePort
  nodePort: 30080
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: qbittorrent.streamnest.lan
      paths:
        - path: /
          pathType: Prefix
