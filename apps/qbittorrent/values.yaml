# Single-environment values for qBittorrent. Digest must be re-scanned before use.
persistence:
  size: 5Gi

service:
  type: NodePort
  nodePort: 30080
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: qbittorrent.streamnest.lan
      paths:
        - path: /
          pathType: Prefix
