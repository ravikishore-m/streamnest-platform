name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Helm lint charts
        run: |
          set -euo pipefail
          for c in charts/*; do
            [ -f "$c/Chart.yaml" ] || continue
            helm lint "$c"
          done

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.0
      - name: Terraform fmt + validate
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infrastructure/terraform
          cd infrastructure/terraform/environments/streamnest
          terraform init -backend=false -input=false
          terraform validate

  secrets-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block secret filenames and obvious inventory
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)secrets\.ya?ml$|\.tfstate$|kubeconfig|(^|/)config/local\.ya?ml$|(^|/)config/local/age\.key$'; then
            echo "Forbidden plaintext secret-like paths are tracked" >&2
            exit 1
          fi
          for f in $(git ls-files 'secrets/*' 2>/dev/null || true); do
            case "$f" in
              secrets/README.md|secrets/*.example|*.enc.yaml|*.enc.yml) continue ;;
            esac
            if [[ "$f" == *.yaml || "$f" == *.yml ]] && ! grep -q 'sops:' "$f"; then
              echo "Unencrypted file under secrets/: $f" >&2
              exit 1
            fi
          done
          if git grep -nE '192\.168\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+|100\.[0-9]+\.[0-9]+\.[0-9]+' -- '*.md' '*.yaml' '*.yml' '*.tf' '*.sh' ':!.github/**' ':!secrets/**' 2>/dev/null; then
            echo "Private IP literals must not be committed" >&2
            exit 1
          fi
