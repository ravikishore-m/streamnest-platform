name: floci-contract

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - "services/**"
      - "apps/**"
      - "docs/architecture/floci-validation.md"
      - ".github/workflows/floci-contract.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "services/**"
      - "apps/**"
      - "docs/architecture/floci-validation.md"
      - ".github/workflows/floci-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floci-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: "111111111111"
  AWS_SECRET_ACCESS_KEY: ci-only-not-a-secret
  AWS_ENDPOINT_URL: http://127.0.0.1:4566

jobs:
  aws-contracts:
    name: Floci AWS API contract checks
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci@sha256:e0b292df4dc9559b7b1bf4f51bdda4bb8e269276236438cd03cae661260ea8a9
        ports:
          - 4566:4566
        env:
          FLOCI_DEFAULT_REGION: us-east-1
          FLOCI_STORAGE_MODE: memory

    steps:
      - name: Wait for Floci
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "${AWS_ENDPOINT_URL}/_floci/health" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$(docker ps --filter name=floci --format '{{.ID}}' | head -n 1)"
          exit 1

      - name: Verify S3 object lifecycle
        run: |
          set -euo pipefail
          bucket="streamnest-ci-${GITHUB_RUN_ID}"
          printf 'floci contract data\n' >/tmp/floci-contract.txt
          aws s3api create-bucket --bucket "${bucket}" --endpoint-url "${AWS_ENDPOINT_URL}"
          aws s3 cp /tmp/floci-contract.txt "s3://${bucket}/contract.txt" --endpoint-url "${AWS_ENDPOINT_URL}"
          aws s3api head-object --bucket "${bucket}" --key contract.txt --endpoint-url "${AWS_ENDPOINT_URL}"

      - name: Verify SQS event lifecycle
        run: |
          set -euo pipefail
          queue_url="$(aws sqs create-queue --queue-name streamnest-ci-events --endpoint-url "${AWS_ENDPOINT_URL}" --query QueueUrl --output text)"
          aws sqs send-message --queue-url "${queue_url}" --message-body contract-check --endpoint-url "${AWS_ENDPOINT_URL}" >/dev/null
          count="$(aws sqs get-queue-attributes --queue-url "${queue_url}" --attribute-names ApproximateNumberOfMessages --endpoint-url "${AWS_ENDPOINT_URL}" --query Attributes.ApproximateNumberOfMessages --output text)"
          test "${count}" -ge 1

      - name: Verify Secrets Manager and IAM APIs
        run: |
          set -euo pipefail
          aws secretsmanager create-secret \
            --name streamnest/ci/contract \
            --secret-string ci-contract-value \
            --endpoint-url "${AWS_ENDPOINT_URL}" >/dev/null
          value="$(aws secretsmanager get-secret-value \
            --secret-id streamnest/ci/contract \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --query SecretString --output text)"
          test "${value}" = ci-contract-value
          aws iam create-role \
            --role-name streamnest-ci-contract-role \
            --assume-role-policy-document '{"Version":"2012-10-17","Statement":[]}' \
            --endpoint-url "${AWS_ENDPOINT_URL}" >/dev/null

      - name: Record emulator evidence
        run: |
          {
            echo "## Floci contract evidence"
            echo "- Emulator: `floci/floci:2.3.0@sha256:e0b292df4dc9…`"
            echo "- Endpoint: `127.0.0.1:4566` (GitHub-hosted runner only)"
            echo "- Covered APIs: S3, SQS, Secrets Manager, IAM"
            echo "- Scope: disposable CI compatibility checks; no NAS state or production credentials"
          } >>"${GITHUB_STEP_SUMMARY}"
