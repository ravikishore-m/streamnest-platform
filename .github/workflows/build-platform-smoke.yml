name: build-platform-smoke

on:
  push:
    branches: [main]
    paths:
      - "services/platform-smoke/**"
      - ".github/workflows/build-platform-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Runs on NAS/k3s self-hosted runner — not GitHub-hosted (no Mac)
    runs-on: [self-hosted, streamnest]
    steps:
      - uses: actions/checkout@v4
      - name: Build and push to NAS registry
        env:
          REGISTRY: ${{ secrets.STREAMNEST_REGISTRY }}
          REGISTRY_USER: ${{ secrets.STREAMNEST_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.STREAMNEST_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          IMAGE="$REGISTRY/streamnest/platform-smoke"
          DIGEST=$(docker build -q -t "$IMAGE:git-${GITHUB_SHA::12}" services/platform-smoke)
          docker tag "$IMAGE:git-${GITHUB_SHA::12}" "$IMAGE:latest"
          docker push "$IMAGE:git-${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:git-${GITHUB_SHA::12}"
