name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      replicate_seeds:
        description: "One-way replicate live NAS app configs → seeds (does not modify originals)"
        type: boolean
        default: false
      apply_seeds:
        description: "Apply seeds into k8s PVCs after replicate"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Helm lint
        run: |
          set -euo pipefail
          for c in charts/*; do
            [ -f "$c/Chart.yaml" ] || continue
            helm lint "$c"
          done
      - name: Secrets hygiene
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|(^|/)secrets\.ya?ml$|\.tfstate$|kubeconfig|(^|/)config/local\.ya?ml$|(^|/)config/local/age\.key$'; then
            echo "Forbidden plaintext secret paths are tracked" >&2
            exit 1
          fi
          # Allow only SOPS-encrypted blobs under secrets/
          for f in $(git ls-files 'secrets/*.yaml' 'secrets/*.yml' 2>/dev/null || true); do
            case "$f" in
              *.enc.yaml|*.enc.yml) ;;
              secrets/README.md) ;;
              *)
                if ! grep -q '^sops:' "$f" 2>/dev/null && ! grep -q 'sops:' "$f" 2>/dev/null; then
                  echo "Unencrypted secret file tracked: $f" >&2
                  exit 1
                fi
                ;;
            esac
          done
          if git grep -nE '192\.168\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+|100\.[0-9]+\.[0-9]+\.[0-9]+' \
            -- '*.md' '*.yaml' '*.yml' '*.tf' '*.sh' ':!.github/**' ':!secrets/**' 2>/dev/null; then
            echo "Private IP literals must not be committed" >&2
            exit 1
          fi

  build-push-deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, streamnest]
    steps:
      - uses: actions/checkout@v4
      - name: Build, push, Argo refresh
        env:
          REGISTRY: ${{ secrets.STREAMNEST_REGISTRY }}
          REGISTRY_USER: ${{ secrets.STREAMNEST_REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.STREAMNEST_REGISTRY_PASSWORD }}
          REPLICATE_SEEDS: ${{ github.event_name == 'workflow_dispatch' && inputs.replicate_seeds || 'false' }}
          APPLY_SEEDS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_seeds || 'false' }}
          NAS_CONFIG_ROOT: ${{ secrets.STREAMNEST_NAS_CONFIG_ROOT }}
          NAS_SEED_ROOT: ${{ secrets.STREAMNEST_NAS_SEED_ROOT }}
          NAS_NFS_SERVER: ${{ secrets.STREAMNEST_NAS_NFS_SERVER }}
          KUBECTL: ${{ secrets.STREAMNEST_KUBECTL || 'kubectl' }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/ci-build-push-deploy.sh
