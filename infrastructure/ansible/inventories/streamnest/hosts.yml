# Example inventory — copy to hosts.local.yml (gitignored) with real addresses.
# One host: the Linux guest that runs the single k3s environment.
all:
  children:
    k3s:
      hosts:
        streamnest:
          ansible_host: K3S_NODE_IP
          ansible_user: ubuntu
          # ansible_ssh_private_key_file: set in hosts.local.yml only
      vars:
        k3s_role: server
        cluster_env: streamnest
