---
- name: Bootstrap single-node k3s server
  hosts: k3s
  become: true
  gather_facts: true
  vars:
    # Pin the approved stable release. Override with -e only after compatibility
    # testing against the selected Argo/cert-manager versions.
    k3s_version: "v1.37.1+k3s1"
  tasks:
    - name: Ensure prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - git
          - open-iscsi
          - nfs-common
        state: present
        update_cache: true
      register: prerequisites
      retries: 5
      delay: 10
      until: prerequisites is succeeded

    - name: Download the reviewed k3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/sbin/streamnest-k3s-install
        owner: root
        group: root
        mode: "0755"

    - name: Install pinned k3s server (disable Traefik; use later ingress)
      ansible.builtin.command: /usr/local/sbin/streamnest-k3s-install
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: "server --disable traefik --write-kubeconfig-mode 644"

    - name: Wait for node Ready
      ansible.builtin.command: kubectl get nodes --no-headers
      register: nodes
      until: nodes.stdout is search("Ready")
      retries: 30
      delay: 10
      changed_when: false

    - name: Show node status
      ansible.builtin.debug:
        var: nodes.stdout_lines
