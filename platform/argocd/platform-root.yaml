apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: streamnest-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: streamnest
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: streamnest
  source:
    repoURL: https://github.com/ravikishore-m/streamnest-platform.git
    targetRevision: main
    path: platform/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
